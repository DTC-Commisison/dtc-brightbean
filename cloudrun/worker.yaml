apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: dtc-brightbean-worker
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
    spec:
      containers:
        - image: gcr.io/<project>/dtc-brightbean:latest
          command: ["python", "manage.py", "process_tasks"]
          resources:
            limits:
              memory: 512Mi
              cpu: 500m
