apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: dtc-brightbean-web
spec:
  template:
    spec:
      containers:
        - image: gcr.io/<project>/dtc-brightbean:latest
          ports:
            - containerPort: 8000
          env: []
          resources:
            limits:
              memory: 512Mi
              cpu: 1000m
