name: Design & Publish (Pencil → Brightbean)

on:
  workflow_dispatch:
    inputs:
      city:
        description: "FIFA corridor city key"
        required: true
        default: "vancouver"
        type: choice
        options:
          - vancouver
          - seattle
          - bay-area
          - los-angeles
          - dallas
          - new-york
          - miami
      platforms:
        description: "Platforms (comma-separated)"
        required: true
        default: "instagram,linkedin"
      workspace_id:
        description: "Brightbean workspace UUID"
        required: true
        default: "9a16be6b-003d-4b93-bf46-fb6792f45e1b"
      caption:
        description: "Post caption (auto-generated if blank)"
        required: false
        default: ""

jobs:
  design-and-publish:
    name: "Design ${{ inputs.city }} → Brightbean"
    runs-on: ubuntu-latest
    env:
      PENCIL_URL: https://pencil-dtccommission-phase0.up.railway.app
      BRIGHTBEAN_URL: https://brightbean-studio-web-dtccommission-phase0.up.railway.app

    steps:
      - name: Trigger Pencil campaign design
        id: pencil
        run: |
          echo "Triggering Pencil campaign for: ${{ inputs.city }}"
          BODY=$(curl -s -X POST \
            "${PENCIL_URL}/api/campaign/${{ inputs.city }}" \
            -H "Content-Type: application/json" \
            -d "{\"context\": \"${{ inputs.caption }}\"}")
          echo "Pencil response: $BODY"
          sleep 8

          ASSET_URL=$(python3 - << 'EOF'
          import sys, json, os
          body = os.environ.get("PENCIL_BODY", "")
          try:
              d = json.loads(body)
              url = d.get("assetUrl") or d.get("url") or d.get("compositionUrl") or ""
              print(url)
          except Exception:
              print("")
          EOF
          )

          if [ -z "$ASSET_URL" ]; then
            ASSET_URL="${PENCIL_URL}/pnw-food-story/${{ inputs.city }}.png"
            echo "Using static fallback: $ASSET_URL"
          fi
          echo "asset_url=${ASSET_URL}" >> "$GITHUB_OUTPUT"
        env:
          PENCIL_BODY: ${{ steps.pencil.outputs.pencil_body || '' }}

      - name: Send asset to Brightbean webhook
        id: brightbean
        env:
          PENCIL_WEBHOOK_SECRET: ${{ secrets.PENCIL_WEBHOOK_SECRET }}
          ASSET_URL: ${{ steps.pencil.outputs.asset_url }}
        run: |
          python3 - << 'EOF'
          import json, hmac, hashlib, os, urllib.request, sys

          secret = os.environ["PENCIL_WEBHOOK_SECRET"].encode()
          brightbean_url = os.environ["BRIGHTBEAN_URL"]
          asset_url = os.environ["ASSET_URL"]
          city = "${{ inputs.city }}"
          caption = "${{ inputs.caption }}"
          workspace_id = "${{ inputs.workspace_id }}"
          run_id = "${{ github.run_id }}"
          platforms_raw = "${{ inputs.platforms }}"

          platforms = [p.strip() for p in platforms_raw.split(",") if p.strip()]

          payload = {
              "_type": "mediaAsset",
              "_id": f"pencil-{city}-{run_id}",
              "url": asset_url,
              "workspace_id": workspace_id,
              "city": city,
              "caption": caption,
              "platforms": platforms,
          }
          body = json.dumps(payload).encode()
          sig = "sha256=" + hmac.new(secret, body, hashlib.sha256).hexdigest()

          req = urllib.request.Request(
              f"{brightbean_url}/api/webhooks/asset-received",
              data=body,
              headers={"Content-Type": "application/json", "X-Pencil-Signature": sig},
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  result = json.load(resp)
                  print(f"Brightbean response: {result}")
                  post_id = result.get("post_id", "")
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write(f"post_id={post_id}\n")
          except Exception as exc:
              print(f"Brightbean webhook error: {exc}", file=sys.stderr)
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("post_id=\n")
          EOF

      - name: Report to Port
        if: always()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          operation: UPSERT
          identifier: "campaign-${{ inputs.city }}-${{ github.run_id }}"
          title: "Campaign — ${{ inputs.city }} (run ${{ github.run_id }})"
          blueprint: campaign
          properties: |-
            {
              "jobId": "${{ github.run_id }}",
              "status": "SUCCESS",
              "designUrl": "https://pencil-dtccommission-phase0.up.railway.app/explore-clique"
            }
          relations: |-
            {
              "city": "${{ inputs.city }}"
            }
